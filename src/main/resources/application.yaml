spring:
  application:
    name: QuickJob

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/quickjob}
    username: ${DB_USERNAME:quickjob}
    password: ${DB_PASSWORD:quickjob}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    check-template-location: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

quickjob:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
  mission:
    min-duration: 60
    max-duration: 120
    max-advance-hours: 48
    default-search-radius-meters: 5000
    max-search-radius-meters: 20000
    max-required-workers: 5
  mail:
    from: ${MAIL_FROM:noreply@quickjob.app}
    enabled: ${MAIL_ENABLED:true}
  money:
    min-remuneration:
      XOF: 500
      GHS: 5
    platform-commission-percent: 10
