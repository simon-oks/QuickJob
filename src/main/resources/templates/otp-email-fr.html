<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Code de vérification</title>
</head>
<body style="margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background-color:#f4f4f4;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;padding:40px;">
                <tr>
                    <td align="center" style="padding-bottom:24px;">
                        <h1 style="color:#1a1a2e;margin:0;font-size:24px;" th:text="${appName}">QuickJob</h1>
                    </td>
                </tr>
                <tr>
                    <td style="color:#333333;font-size:16px;line-height:24px;padding-bottom:24px;">
                        <p>Bonjour,</p>
                        <p>Voici votre code de vérification :</p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding-bottom:24px;">
                        <div style="background-color:#f0f0f5;border-radius:8px;padding:16px 32px;display:inline-block;">
                            <span style="font-size:32px;font-weight:bold;letter-spacing:8px;color:#1a1a2e;" th:text="${code}">123456</span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="color:#666666;font-size:14px;line-height:20px;">
                        <p>Ce code est valable 5 minutes. Ne le partagez avec personne.</p>
                        <p>Si vous n'avez pas demandé ce code, ignorez cet email.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
